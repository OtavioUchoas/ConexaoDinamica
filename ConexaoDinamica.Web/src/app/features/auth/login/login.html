<div class="pagina">
  <mat-card class="cartao">
    @if (carregando()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <mat-card-header>
      <mat-card-title>ConexaoDinamica</mat-card-title>
      <mat-card-subtitle>Acesse sua conta</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form class="formulario" (ngSubmit)="entrar()">
        <mat-form-field appearance="outline">
          <mat-label>E-mail</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="email"
                 [disabled]="carregando()" autocomplete="username" required />
          <mat-icon matSuffix>mail</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input matInput type="password" name="senha" [(ngModel)]="senha"
                 [disabled]="carregando()" autocomplete="current-password" required />
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

        @if (erro(); as mensagem) {
          <div class="erro" role="alert">
            <mat-icon>error_outline</mat-icon>
            <span>{{ mensagem }}</span>
          </div>
        }

        <button matButton="filled" type="submit" [disabled]="carregando()">
          {{ carregando() ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>

      <div class="rodape">
        <a matButton routerLink="/admin/login" class="acesso-admin">
          <mat-icon>shield_person</mat-icon>
          Acesso administrativo
        </a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
